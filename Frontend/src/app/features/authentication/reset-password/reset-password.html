<div class="auth-page">
  <h3>Insurance Application</h3>

  <div class="auth-box">
    <h2>Reset password</h2>

    <form [formGroup]="resetForm" (ngSubmit)="ResetPassword(resetForm.value)">
      <label for="username">Username</label>
      <input id="username" type="text" formControlName="username"
        placeholder="Enter username" autocomplete="username">

      <label for="token">Reset token</label>
      <input id="token" type="text" formControlName="token"
        placeholder="Paste token from email" autocomplete="off">

      <label for="newPassword">New password</label>
      <input id="newPassword" type="password" formControlName="newPassword"
        placeholder="Enter new password" autocomplete="new-password">

      <label for="confirmPassword">Confirm password</label>
      <input id="confirmPassword" type="password" formControlName="confirmPassword"
        placeholder="Confirm new password" autocomplete="new-password">

      <p class="error" role="alert" *ngIf="message">{{message}}</p>

      <button type="submit" [disabled]="loading">
        {{loading ? 'Resetting...' : 'Reset password'}}
      </button>

      <div class="links">
        <a routerLink="/login">Back to login</a>
      </div>
    </form>
  </div>
</div>
