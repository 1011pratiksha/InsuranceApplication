<div class="login-page">
  <h3>Insurance Application</h3>

  <div class="login-box">
    <h2>Login</h2>

    <form [formGroup]="loginForm" (ngSubmit)="Login(loginForm.value)">
      <label for="username">Username</label>

      <input id="username" type="text" formControlName="username"
        placeholder="Enter username" autocomplete="username">

      <p class="error" *ngIf="loginForm.controls.username.touched && loginForm.controls.username.invalid">
        Username is required
      </p>

      <label for="password">Password</label>

      <input id="password" type="password" formControlName="password"
        placeholder="Enter password" autocomplete="current-password">

      <p class="error" *ngIf="loginForm.controls.password.touched && loginForm.controls.password.invalid">
        Password is required
      </p>

      <p class="error" role="alert" *ngIf="message">{{message}}</p>

      <button type="submit" [disabled]="loading">
        {{loading ? 'Logging in...' : 'Login'}}
      </button>

      <a routerLink="/forgot-password">Forgot password?</a>
    </form>
  </div>
</div>
