<div class="auth-page">
  <h3>Insurance Application</h3>

  <div class="auth-box">
    <h2>Forgot password</h2>

    <p>Enter your username to request a reset email.</p>

    <form [formGroup]="forgotForm" (ngSubmit)="ForgotPassword(forgotForm.value)">
      <label for="username">Username</label>

      <input id="username" type="text" formControlName="username"
        placeholder="Enter username" autocomplete="username">

      <p class="error" *ngIf="forgotForm.controls.username.touched && forgotForm.controls.username.invalid">
        Username is required
      </p>

      <p class="message" role="status" *ngIf="message">{{message}}</p>

      <p class="error" role="alert" *ngIf="error">{{error}}</p>

      <button type="submit" [disabled]="loading">
        {{loading ? 'Sending...' : 'Send reset token'}}
      </button>

      <div class="links">
        <a routerLink="/login">Back to login</a>
        <a routerLink="/reset-password">Enter reset token</a>
      </div>
    </form>
  </div>
</div>
