<div class="auth-page">
  <h3>Insurance Application</h3>

  <div class="auth-box">
    <h2>{{setupMode ? 'Set up 2FA' : 'Two-factor verification'}}</h2>

    <p *ngIf="!setupMode">
      Enter the code from your authenticator app.
    </p>

    <div *ngIf="setupMode">
      <p>Scan this QR code in Google or Microsoft Authenticator.</p>

      <img *ngIf="qrCode" class="qr-code" [src]="qrCode"
        alt="Authenticator setup QR code">

      <p>Or enter this key manually:</p>

      <div class="manual-key">{{manualKey}}</div>
    </div>

    <form [formGroup]="codeForm" (ngSubmit)="VerifyCode(codeForm.value)">
      <label for="code">6-digit code</label>

      <input id="code" type="text" formControlName="code"
        placeholder="000000" inputmode="numeric"
        maxlength="6" autocomplete="one-time-code">

      <p class="error" *ngIf="codeForm.controls.code.touched && codeForm.controls.code.invalid">
        Enter a six-digit code
      </p>

      <p class="error" role="alert" *ngIf="message">{{message}}</p>

      <button type="submit" [disabled]="loading">
        {{loading ? 'Please wait...' : (setupMode ? 'Verify and enable' : 'Verify')}}
      </button>

      <button type="button" class="back-button" (click)="BackToLogin()">
        Back to login
      </button>
    </form>
  </div>
</div>
